<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>潮创者 AI｜手机 H5 框架</title>
<style>:root{--ink:#17243a;--muted:#7d899c;--line:#e7ebf2;--brand:#635bff}*{box-sizing:border-box}body{margin:0;background:#eef2f8;color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.phone{width:min(100%,430px);min-height:100vh;margin:auto;background:#fff;padding:18px 16px 28px;box-shadow:0 0 40px #d8deea}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.logo{font-size:18px;font-weight:800}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px}.hero{padding:24px 20px;border-radius:20px;background:linear-gradient(135deg,#665cff,#20b8a7);color:#fff}.hero h1{font-size:25px;line-height:1.25;margin:10px 0}.hero p{color:#e6eaff}.hero .btn{color:#4b43cf;margin-top:10px}.title{font-size:18px;margin:24px 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{border:1px solid var(--line);border-radius:14px;padding:18px 12px;min-height:92px}.card strong{display:block;margin-bottom:8px}.card span{font-size:12px;color:var(--muted)}.task{border:1px dashed #cbd4e2;border-radius:12px;padding:16px;color:var(--muted);margin-top:10px}.bottom{position:sticky;bottom:0;margin:26px -16px -28px;padding:14px 10px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;color:var(--muted);font-size:12px}.bottom b{color:var(--brand)}</style></head>
<body><main class="phone"><div class="top"><div class="logo">潮创者 AI</div><button class="btn">登录入口</button></div><section class="hero"><small>AI CREATIVE WORKSPACE</small><h1>手机端内容创作框架</h1><p>用于展示移动端首页、创作入口和任务区域。</p><button class="btn">开始创作</button></section><h2 class="title">快捷创作</h2><section class="grid"><div class="card"><strong>图片生成</strong><span>创作入口占位</span></div><div class="card"><strong>视频生成</strong><span>创作入口占位</span></div><div class="card"><strong>我的作品</strong><span>作品区域占位</span></div><div class="card"><strong>会员与积分</strong><span>账户区域占位</span></div></section><h2 class="title">最近任务</h2><div class="task">任务列表区域占位</div><div class="task">结果状态区域占位</div><div class="bottom"><b>⌂ 首页</b><span>＋ 创作</span><span>▦ 作品</span><span>¥ 账户</span></div></main></body></html>
